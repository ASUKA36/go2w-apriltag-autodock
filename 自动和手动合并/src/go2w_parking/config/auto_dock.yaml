target_id: 0

# ---- Stage 1: PREALIGN_GATE (门外预对准点) ----
# Face Tag normal + lateral center, then hold front lidar at this range.
# Bearing is not used in control or gate checks.
gate_front_distance: 1.50
gate_front_tolerance: 0.05
gate_facing_tolerance_deg: 3.0
gate_lateral_tolerance: 0.06
# Conditions must stay satisfied this long before entering stage 2.
gate_hold_time: 2.0

# ---- Stage 2/3: enter bay then lidar-only final + crouch ----
target_distance: 0.35
final_front_tolerance: 0.05
final_lateral_tolerance: 0.05
tag_bottom_yx_ratio: 0.22
tag_bottom_range: 0.55

kp_forward: 0.55
kp_lateral: 0.95
kp_facing: 1.2
max_approach_speed: 0.38
max_final_speed: 0.12
max_lateral_speed: 0.18
max_angular_speed: 0.60
kp_corridor_center: 0.65
kp_corridor_angle: 1.0
corridor_max_width: 1.6

lost_timeout: 0.35
# Pre-align allows longer Tag dropout before TAG_LOST (avoids chatter).
prealign_lost_timeout: 2.0
filter_alpha: 0.30

front_stop_distance: 0.22
side_stop_distance: 0.16
scan_front_half_angle_deg: 22.0
scan_side_half_angle_deg: 18.0

auto_lie_down: true
auto_reset_after_park: true
reset_delay: 1.5
restart_after_reset: true
control_rate: 20.0
trajectory_horizon: 3.0
trajectory_step: 0.10
