# Robot footprint and Go2-W-like holonomic motion limits.
# Match the supplied sketch: about 77% of kennel depth and 71% of clear width.
robot_length: 1.20
robot_width: 0.80
max_forward: 0.80
max_reverse: 0.45
max_lateral: 0.40
max_angular: 1.20
accel_forward: 0.90
accel_lateral: 0.70
accel_angular: 2.00
command_timeout: 0.40

# Default spawn is centered 2 m in front of the kennel and faces the Tag.
# The controller intentionally has no search stage, so random yaw would often
# start in WAIT_TAG forever. Set spawn_yaw_random=true for manual robustness tests.
spawn_region_center_x: -2.0
spawn_region_center_y: 0.0
spawn_region_size: 0.0
spawn_yaw_random: false
# Fallback fixed pose (only used when spawn_yaw_random is false).
initial_x: -2.0
initial_y: 0.0
initial_yaw: 0.0

# PREALIGN_GATE visualization — keep in sync with auto_dock.yaml.
# 2-D sim measures both /scan and Tag z from the robot origin, so
# origin_x = tag_x - prealign_front_distance  (1.25 - 1.50 = -0.25 m).
show_prealign_zone: true
prealign_front_distance: 1.50
prealign_front_tolerance: 0.05
prealign_lateral_tolerance: 0.06
prealign_facing_tolerance_deg: 3.0

# U-shaped kennel. The opening faces -x. Wall height is 1.2 m (3-D world).
kennel_back_x: 1.29
kennel_front_x: 0.0
kennel_half_width: 0.50
wall_thickness: 0.08

# Charging pad: 1.2 m (X) x 0.7 m (Y), center 0.55 m in front of the Tag.
charger_pad_x: 0.70
charger_pad_y: 0.0
charger_pad_length: 1.20
charger_pad_width: 0.70
charger_bridge_length: 0.06
charger_bridge_width: 0.40

# Parking target: head ~0.35 m from Tag when crouched (camera_offset ~0.30).
goal_x: 0.60
goal_y: 0.0
goal_yaw: 0.0
goal_position_tolerance: 0.10
goal_yaw_tolerance_deg: 8.0
goal_speed_tolerance: 0.03
goal_hold_time: 1.0

map_resolution: 0.04
map_min_x: -5.5
map_max_x: 2.4
map_min_y: -2.0
map_max_y: 2.0
scan_beams: 180
scan_range: 8.0
simulation_rate: 50.0
publish_rate: 20.0

# Simulated charging-station AprilTag on the kennel back wall.
# Tag side length 0.11 m; center height 0.30 m above ground (3-D).
publish_tag_detection: true
tag_id: 0
tag_size: 0.11
tag_x: 1.25
tag_y: 0.0
tag_max_range: 6.0
tag_horizontal_fov_deg: 80.0

# Lightweight RGB camera visualization matching the simulated Tag pose.
camera_width: 424
camera_height: 240
camera_fx: 310.0
camera_fy: 310.0
camera_offset: 0.30
